<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Beat Blade</title>
<style>
:root{--bg:#0b0b16;--card:#171728;--tx:#eef;--r:#ff3860;--b:#3aa0ff;--ac:#9b5cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;overflow:hidden}
.scr{position:fixed;inset:0;display:none;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));gap:10px;overflow:auto}
.scr.on{display:flex}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid #334;border-radius:10px;padding:10px 12px}
button{background:var(--ac);border:0;font-weight:700}
button.g{background:var(--card);border:1px solid #445}
button:disabled{opacity:.4}
h1{margin:8px 0;font-size:34px;background:linear-gradient(90deg,var(--r),var(--b));-webkit-background-clip:text;color:transparent}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}
.item{background:var(--card);padding:12px;border-radius:10px;display:flex;justify-content:space-between;gap:8px}
#side button{opacity:.4}#side button.on{opacity:1}
#L{background:var(--r)}#R{background:var(--b)}
canvas#grid{width:100%;aspect-ratio:4/3;background:#10101f;border-radius:12px;touch-action:none}
input[type=range]{padding:0;width:100%}
#hud{position:fixed;inset:0;pointer-events:none;display:none;text-shadow:0 0 12px #000}
#sc{position:absolute;top:calc(10px + env(safe-area-inset-top));width:100%;text-align:center;font-size:38px;font-weight:900;letter-spacing:2px}
#cb{position:absolute;top:calc(58px + env(safe-area-inset-top));width:100%;text-align:center;font-size:20px;font-weight:800;color:#ffd34d}
#jud{position:absolute;left:50%;top:38%;font-size:34px;font-weight:900;opacity:0;transform:translate(-50%,0)}
#prog{position:absolute;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));height:6px;background:#ffffff22;border-radius:3px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff3860,#3aa0ff);box-shadow:0 0 10px #3aa0ff}
#flash{position:fixed;inset:0;background:radial-gradient(transparent 40%,#f00);opacity:0;pointer-events:none;transition:opacity .2s;z-index:4}
#gl{position:fixed;inset:0;display:none;touch-action:none}
#vrb{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:none;z-index:5}
small{opacity:.7}
#menu,#editor{max-width:720px;margin:0 auto}
button,select,input,label,canvas{cursor:pointer}
button:hover{filter:brightness(1.15)}
</style></head><body>

<div id="menu" class="scr on">
  <h1>BEAT BLADE</h1>
  <button id="bEdit">✏️ Level Editor</button>
  <button id="bBrowse">🌐 Play Published Levels</button>
  <small id="msg">Left-hand friendly: one saber hits every block.</small>
  <div id="list" style="display:flex;flex-direction:column;gap:8px"></div>
</div>

<div id="editor" class="scr">
  <div class="row"><button class="g" id="eBack">← Back</button><input id="title" placeholder="Level title"></div>
  <div class="row"><select id="gh"><option value="">GitHub Songs/ …</option></select>
    <label class="g" style="padding:10px 12px;background:var(--card);border-radius:10px;text-align:center">📁 Import<input id="file" type="file" accept="audio/*" hidden></label></div>
  <small id="songName">No song selected</small>
  <div class="row"><button id="play">▶ Hear music</button><span id="time" style="text-align:right">0:00</span></div>
  <canvas id="tl" style="width:100%;height:64px;background:#10101f;border-radius:10px;touch-action:none"></canvas>
  <button id="sw" style="background:var(--r)">● RED — tap to switch to BLUE</button>
  <canvas id="grid"></canvas>
  <div class="row"><button class="g" id="prev">◀ ½ beat</button><span id="beat" style="text-align:center">beat 0</span><button class="g" id="next">½ beat ▶</button></div>
  <div class="row"><label>BPM <input id="bpm" type="number" value="120"></label><label>Offset s <input id="off" type="number" step="0.01" value="0"></label></div>
  <div class="row"><button class="g" id="test">🎮 Test</button><button id="pub">🚀 Publish</button></div>
  <small id="emsg"></small>
</div>

<div id="hud"><div id="sc"></div><div id="cb"></div><div id="jud"></div><div id="prog"><i></i></div></div><div id="flash"></div>
<canvas id="gl"></canvas>
<button id="vrb">Enter VR</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ====== CONFIG: fill these in ======
const CFG={SUPABASE_URL:'https://yrwztvwwldzagdtbpost.supabase.co',SUPABASE_KEY:'sb_publishable_Ajx_4Rl8NIIuTN1hFDXIBA_IzcJRmPS',REPO:'EverettIsTheMoon/BeatSaber',BRANCH:'main',BUCKET:'songs'};
const $=id=>document.getElementById(id);
const audio=new Audio();audio.crossOrigin='anonymous';
let LV={title:'',bpm:120,offset:0,songUrl:'',songName:'',notes:[]},side=0,upFile=null,from='menu';
const show=id=>{document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id));};
const sbH=()=>({apikey:CFG.SUPABASE_KEY,Authorization:'Bearer '+CFG.SUPABASE_KEY});

// ====== MENU ======
$('bEdit').onclick=()=>{show('editor');loadGH();draw();};
$('bBrowse').onclick=async()=>{
  const l=$('list');l.innerHTML='Loading…';
  try{
    const r=await fetch(CFG.SUPABASE_URL+'/rest/v1/levels?select=id,title,data&order=created_at.desc&limit=50',{headers:sbH()});
    const rows=await r.json();l.innerHTML='';
    if(!rows.length)l.textContent='No levels yet.';
    rows.forEach(o=>{const d=document.createElement('div');d.className='item';
      d.innerHTML='<span></span><button>Play</button>';d.firstChild.textContent=o.title+' · '+o.data.notes.length+' notes';
      d.lastChild.onclick=()=>{from='menu';startPlay(o.data);};l.appendChild(d);});

// ====== EDITOR ======
async function loadGH(){
  if($('gh').options.length>1)return;
  try{
    const r=await fetch(`https://api.github.com/repos/${CFG.REPO}/contents/Songs?ref=${CFG.BRANCH}`);
    const fs=await r.json();
    fs.filter(f=>/\.(mp3|ogg|wav|m4a)$/i.test(f.name)).forEach(f=>{
      const o=document.createElement('option');o.value=f.download_url;o.textContent=f.name;$('gh').appendChild(o);});
  }catch(e){$('emsg').textContent='Could not read GitHub Songs folder.';}
}
function setSong(url,name){audio.pause();audio.src=url;LV.songName=name;$('songName').textContent='🎵 '+name;$('play').textContent='▶ Hear music';}
$('gh').onchange=e=>{if(!e.target.value)return;upFile=null;LV.songUrl=e.target.value;setSong(e.target.value,e.target.selectedOptions[0].textContent);};
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;upFile=f;LV.songUrl='';setSong(URL.createObjectURL(f),f.name);};
audio.onended=()=>{if(playing)endPlay();$('play').textContent='▶ Hear music';};
$('play').onclick=()=>{if(audio.paused){audio.play();$('play').textContent='⏸ Pause';}else{audio.pause();$('play').textContent='▶ Hear music';}};
const STEP=.5,beatNow=()=>Math.round((audio.currentTime-LV.offset)*LV.bpm/60/STEP)*STEP;
function nudge(d){audio.currentTime=Math.max(0,LV.offset+(beatNow()+d*STEP)*60/LV.bpm);draw();}
$('prev').onclick=()=>nudge(-1);$('next').onclick=()=>nudge(1);
$('bpm').onchange=e=>{LV.bpm=+e.target.value||120;draw();};$('off').onchange=e=>{LV.offset=+e.target.value||0;draw();};
$('sw').onclick=()=>{side^=1;$('sw').style.background=side?'var(--b)':'var(--r)';$('sw').textContent=side?'● BLUE — tap to switch to RED':'● RED — tap to switch to BLUE';draw();};
$('eBack').onclick=()=>{audio.pause();show('menu');};
const cv=$('grid'),cx=cv.getContext('2d');
const tl=$('tl'),tx=tl.getContext('2d');
function fit(c){const w=c.clientWidth,h=c.clientHeight,d=devicePixelRatio||1;if(!w)return 0;
  if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d);}return d;}
function green(c,x,h){c.save();c.strokeStyle='#39ff6a';c.lineWidth=3;c.shadowColor='#39ff6a';c.shadowBlur=12;c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke();c.restore();}
function draw(){
  let d=fit(cv);if(!d)return;const w=cv.clientWidth,h=cv.clientHeight,sec=60/LV.bpm,t=audio.currentTime;
  cx.setTransform(d,0,0,d,0,0);cx.clearRect(0,0,w,h);
  const cw=w/4,ch=h/3,b=beatNow();
  cx.strokeStyle='#334';cx.lineWidth=1;for(let i=0;i<=4;i++){cx.beginPath();cx.moveTo(i*cw,0);cx.lineTo(i*cw,h);cx.stroke();}
  for(let j=0;j<=3;j++){cx.beginPath();cx.moveTo(0,j*ch);cx.lineTo(w,j*ch);cx.stroke();}
  LV.notes.filter(n=>n.b===b).forEach(n=>{
    cx.globalAlpha=n.s===side?1:.15; // other colour shows at 15% opacity
    cx.fillStyle=n.s?'#3aa0ff':'#ff3860';cx.fillRect(n.x*cw+8,n.y*ch+8,cw-16,ch-16);});
  cx.globalAlpha=1;
  const bt=(t-LV.offset)/sec;green(cx,(((bt%1)+1)%1)*w,h); // green beat line sweeps across the blocks
  $('beat').textContent='beat '+b+' · '+LV.notes.length+' notes';$('time').textContent=fmt(t)+' / '+fmt(audio.duration||0);
  d=fit(tl);if(!d)return;const W=tl.clientWidth,H=tl.clientHeight,dur=audio.duration||60;
  tx.setTransform(d,0,0,d,0,0);tx.clearRect(0,0,W,H);
  LV.notes.forEach(n=>{tx.fillStyle=n.s?'#3aa0ff':'#ff3860';tx.fillRect((LV.offset+n.b*sec)/dur*W-1.5,6+n.y*(H-12)/3,3,(H-12)/3-2);});
  green(tx,t/dur*W,H);
}
(function edLoop(){if($('editor').classList.contains('on'))draw();requestAnimationFrame(edLoop);})();
function seekTl(e){const r=tl.getBoundingClientRect();audio.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*(audio.duration||0);}
tl.addEventListener('pointerdown',e=>{tl.setPointerCapture(e.pointerId);seekTl(e);});
tl.addEventListener('pointermove',e=>{if(e.buttons)seekTl(e);});
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*4),y=Math.floor((e.clientY-r.top)/r.height*3),b=beatNow();
  const i=LV.notes.findIndex(n=>n.b===b&&n.x===x&&n.y===y);
  if(i>=0){if(LV.notes[i].s===side)LV.notes.splice(i,1);}else LV.notes.push({b,x,y,s:side});
  draw();});
addEventListener('resize',draw);

async function publish(){
  const m=$('emsg');LV.title=$('title').value.trim()||'Untitled';
  if(!LV.notes.length){m.textContent='Add some notes first.';return;}
  if(!LV.songUrl&&!upFile){m.textContent='Pick a song first.';return;}
  try{
    m.textContent='Publishing…';
    if(upFile){
      const nm=Date.now()+'_'+upFile.name.replace(/[^\w.-]/g,'_');
      const u=await fetch(`${CFG.SUPABASE_URL}/storage/v1/object/${CFG.BUCKET}/${nm}`,{method:'POST',headers:{...sbH(),'Content-Type':upFile.type||'audio/mpeg'},body:upFile});
      if(!u.ok)throw new Error('Song upload '+u.status+': '+(await u.text()).slice(0,160));LV.songUrl=`${CFG.SUPABASE_URL}/storage/v1/object/public/${CFG.BUCKET}/${nm}`;upFile=null;
    }
    const r=await fetch(CFG.SUPABASE_URL+'/rest/v1/levels',{method:'POST',headers:{...sbH(),'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({title:LV.title,data:LV})});
    if(!r.ok)throw new Error('Save level '+r.status+': '+(await r.text()).slice(0,160));m.textContent='✅ Published!';
  }catch(e){m.textContent='Publish failed — '+(e&&e.message?e.message:'network error / check Supabase URL+key');}
}
$('pub').onclick=publish;
$('test').onclick=()=>{audio.pause();from='editor';LV.title=$('title').value;startPlay(LV);};

// ====== GAME (three.js, touch + WebXR) ======
const SPEED=6,HZ=.6;
let actx,an,fd,kick=0,avgE=0,started=false,R,S,C,rig,env,floorTex,bars=[],notes=[],playing=false,score=0,combo=0,maxCombo=0,hits=0,st=0,vrOn=false,vrOk=false,ctrls=[],tips=[],parts=[],clock,glowTex,hudCv,hudCx,hudTex,hudMesh,jTxt='',jCol='#fff',jT=0,hf=0;
if(navigator.xr)navigator.xr.isSessionSupported('immersive-vr').then(ok=>{vrOk=ok;}).catch(()=>{});
const cols=[0xff3860,0x3aa0ff],css=['#ff3860','#3aa0ff'];
const mult=()=>Math.min(4,1+Math.floor(combo/8));
function glowSprite(c,s,o){const m=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:c,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:o}));m.scale.set(s,s,1);return m;}
function init3(){
  if(R)return;
  R=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.xr.enabled=true;
  clock=new THREE.Clock();
  const g=document.createElement('canvas');g.width=g.height=64;const gc=g.getContext('2d'),gr=gc.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.3,'rgba(255,255,255,.35)');gr.addColorStop(1,'rgba(255,255,255,0)');gc.fillStyle=gr;gc.fillRect(0,0,64,64);glowTex=new THREE.CanvasTexture(g);
  S=new THREE.Scene();S.background=new THREE.Color(0x05050d);S.fog=new THREE.Fog(0x05050d,10,38);
  C=new THREE.PerspectiveCamera(75,1,.05,60);C.position.set(0,1.3,0);
  rig=new THREE.Group();rig.add(C);S.add(rig);
  S.add(new THREE.HemisphereLight(0x8899ff,0x221133,1.1));
  env=new THREE.Group();S.add(env);
  const t=document.createElement('canvas');t.width=t.height=128;const tc=t.getContext('2d');
  tc.fillStyle='#07071a';tc.fillRect(0,0,128,128);tc.shadowColor='#4cf';tc.shadowBlur=8;tc.strokeStyle='#3cf';tc.lineWidth=3;
  tc.strokeRect(0,0,128,128);
  floorTex=new THREE.CanvasTexture(t);floorTex.wrapS=floorTex.wrapT=THREE.RepeatWrapping;floorTex.repeat.set(8,60);
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(8,60),new THREE.MeshBasicMaterial({map:floorTex}));fl.rotation.x=-Math.PI/2;fl.position.z=-25;env.add(fl);
  for(const sx of[-2.2,2.2]){
    const rail=new THREE.Mesh(new THREE.BoxGeometry(.08,.08,60),new THREE.MeshBasicMaterial({color:sx<0?0xff3860:0x3aa0ff}));rail.position.set(sx,.05,-25);env.add(rail);
    for(let i=0;i<15;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(.12,3,.12),new THREE.MeshStandardMaterial({color:0x111122,emissive:i%2?0xff3860:0x3aa0ff,emissiveIntensity:1}));
      b.position.x=sx*1.6;b.userData.i=i;b.userData.x=sx*1.6;env.add(b);bars.push(b);
      const gs=glowSprite(i%2?0xff3860:0x3aa0ff,2.2,.5);gs.position.y=0;b.add(gs);}
  }
  const sp=new Float32Array(900);for(let i=0;i<900;i+=3){sp[i]=(Math.random()-.5)*50;sp[i+1]=Math.random()*18;sp[i+2]=-Math.random()*60;}
  const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
  env.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xaabbff,size:.12,sizeAttenuation:true})));
  mkSaber(0);mkSaber(1);
  hudCv=document.createElement('canvas');hudCv.width=512;hudCv.height=256;hudCx=hudCv.getContext('2d');hudTex=new THREE.CanvasTexture(hudCv);
  hudMesh=new THREE.Mesh(new THREE.PlaneGeometry(3,1.5),new THREE.MeshBasicMaterial({map:hudTex,transparent:true,fog:false}));hudMesh.visible=false;S.add(hudMesh);
  resize();addEventListener('resize',resize);R.setAnimationLoop(loop);
  if(navigator.xr)navigator.xr.isSessionSupported('immersive-vr').then(ok=>{vrOk=ok;});
}
function resize(){if(!R||vrOn)return;R.setSize(innerWidth,innerHeight);const a=innerWidth/innerHeight;C.aspect=a;C.fov=75;
  // keep the whole 4-wide grid on screen: back the camera up when the screen is narrow (portrait)
  const d=1.2/(Math.tan(37.5*Math.PI/180)*a);C.position.z=Math.min(3.4,Math.max(0,d-HZ));C.updateProjectionMatrix();}
async function enterVR(){
  if(vrOn||!R||!navigator.xr)return;
  try{
    const ss=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor']});
    R.xr.setReferenceSpaceType('local-floor');await R.xr.setSession(ss);vrOn=true;hudMesh.visible=true;$('vrb').style.display='none';$('hud').style.display='none';
    ss.addEventListener('end',()=>{vrOn=false;hudMesh.visible=false;resize();if(playing){$('hud').style.display='block';if(vrOk)$('vrb').style.display='block';}});
  }catch(e){if(playing&&vrOk)$('vrb').style.display='block';}
}
$('vrb').onclick=enterVR;
const geo=new THREE.BoxGeometry(.38,.38,.38),eg=new THREE.EdgesGeometry(geo),em=new THREE.LineBasicMaterial({color:0xffffff});
const mats=cols.map(c=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.8,roughness:.3,metalness:.3}));
function startPlay(lv){
  init3();resize();initAudio();LV=lv;score=0;combo=0;maxCombo=0;hits=0;st=-2;jT=0;started=false;
  notes.forEach(n=>S.remove(n.m));
  notes=lv.notes.map(n=>{const m=new THREE.Group();m.add(new THREE.Mesh(geo,mats[n.s]),new THREE.LineSegments(eg,em),glowSprite(cols[n.s],1.1,.7));
    const t=lv.offset+n.b*60/lv.bpm;m.position.set((n.x-1.5)*.5,.7+(2-n.y)*.45,-t*SPEED-HZ);m.visible=false;S.add(m);
    return{t,m,s:n.s,done:false};});
  document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));
  $('gl').style.display='block';$('hud').style.display='block';if(vrOk&&!vrOn)$('vrb').style.display='block';
  audio.src=lv.songUrl||audio.src;audio.currentTime=0;pop('GET READY','#fff');
  audio.muted=true;audio.play().then(()=>{audio.pause();audio.muted=false;audio.currentTime=0;}).catch(()=>{audio.muted=false;}); // unlock audio inside the tap
  playing=true;
  if(vrOk&&!vrOn)enterVR(); // on a VR browser, jump straight into VR (called inside the tap/click)
}
function endPlay(){
  if(!playing)return;playing=false;audio.pause();$('gl').style.display='none';$('hud').style.display='none';$('vrb').style.display='none';hudMesh.visible=false;
  if(vrOn)R.xr.getSession().end();
  $('msg').textContent=`Score ${score} · Accuracy ${notes.length?Math.round(hits/notes.length*100):0}% · Max combo ${maxCombo}`;show(from);
}
function initAudio(){ // real audio analysis so visuals follow the actual music
  try{if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)();an=actx.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=.5;
    actx.createMediaElementSource(audio).connect(an);an.connect(actx.destination);fd=new Uint8Array(an.frequencyBinCount);}actx.resume();}catch(e){an=null;}
}
const SD=new THREE.Vector3(0,1,-.15).normalize(),BL=1.0,sabers=[];
function mkSaber(i){ // lightsaber held in your hand, blade pointing up
  const c=R.xr.getController(i);rig.add(c);const g=new THREE.Group(),y=.15+BL/2;
  const add=(r,col,op)=>{const m=new THREE.MeshBasicMaterial({color:col,transparent:op<1,opacity:op,blending:op<1?THREE.AdditiveBlending:THREE.NormalBlending,depthWrite:false});
    const h=new THREE.Mesh(new THREE.CylinderGeometry(r,r,BL,12),m);h.position.y=y;g.add(h);return m;};
  add(.012,0xffffff,1);const m1=add(.03,0xff3860,.6),m2=add(.07,0xff3860,.22);
  const hilt=new THREE.Mesh(new THREE.CylinderGeometry(.022,.022,.3,10),new THREE.MeshStandardMaterial({color:0x99a,metalness:.8,roughness:.3}));g.add(hilt);
  const gs=glowSprite(0xff3860,1.6,.8);gs.position.y=y;g.add(gs);
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),SD);g.visible=false;rig.add(g);
  const o={c,g,mats:[m1,m2,gs.material]};
  c.addEventListener('connected',e=>{const col=e.data&&e.data.handedness==='right'?0x3aa0ff:0xff3860;o.mats.forEach(m=>m.color.setHex(col));});
  sabers.push(o);tips.push(new THREE.Vector3());
}
function pop(t,c){jTxt=t;jCol=c;jT=1;}
function burst(p,c){for(let i=0;i<10;i++){const s=glowSprite(c,.18,1);s.position.copy(p);
  s.userData.v=new THREE.Vector3((Math.random()-.5)*3,(Math.random()-.2)*3,(Math.random()-.5)*3);s.userData.l=.5;S.add(s);parts.push(s);}}
function hit(n,now){
  const d=Math.abs(n.t-now),perf=d<.07;n.done=true;n.m.visible=false;
  combo++;maxCombo=Math.max(maxCombo,combo);hits++;score+=(perf?150:100)*mult();
  pop(perf?'PERFECT':'GOOD',perf?'#ffe14d':'#7dff9b');burst(n.m.position,cols[n.s]);hf=1;
}
function miss(n){
  n.done=true;n.m.visible=false;combo=0;score=Math.max(0,score-100);pop('MISS','#ff4d4d');
  $('flash').style.opacity=.55;setTimeout(()=>$('flash').style.opacity=0,120);
}
const ray=new THREE.Raycaster(),pt=new THREE.Vector2();
$('gl').addEventListener('pointerdown',pk);$('gl').addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')pk(e);});
function pk(e){

}

  x.strokeStyle='#3cf';x.lineWidth=4;x.strokeRect(2,2,508,252);x.textAlign='center';

  x.fillStyle='#ffd34d';x.font='bold 40px sans-serif';x.fillText('x'+mult()+'  combo '+combo,256,130);
  x.fillStyle=jCol;x.globalAlpha=Math.max(jT,0);x.font='bold 44px sans-serif';x.fillText(jTxt,256,185);x.globalAlpha=1;
  x.fillStyle='#223';x.fillRect(30,215,452,16);x.fillStyle='#3cf';x.fillRect(30,215,452*Math.min(1,st/(audio.duration||1)),16);

const v=new THREE.Vector3(),w=new THREE.Vector3(),u=new THREE.Vector3();let fr=0;

    if(!started&&st>=0){started=true;audio.muted=false;audio.currentTime=0;audio.play().catch(()=>{});}
    st+=dt;if(started&&!audio.paused&&audio.currentTime>0)st+=(audio.currentTime-st)*.1; // own clock, gently synced to audio

    if(live){an.getByteFrequencyData(fd);let e=0;for(let k=1;k<4;k++)e+=fd[k];e/=3*255;avgE+=(e-avgE)*.04;const d=e-avgE;kick=Math.max(d>.02?Math.min(1,d*6):0,kick*.82);}else{fd&&fd.fill(0);kick*=.85;} // kick drum = 40-170Hz
    p=kick;

}
